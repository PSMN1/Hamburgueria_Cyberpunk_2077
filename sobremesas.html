<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sobremesas | Rust & Bun</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="header">
    <div class="container">
        <div class="navbar">
            <div class="logo">
                <a href="index.html">
                    <img src="Imagens/Logo/Rust & Bun.png" alt="">
                </a>
            </div>
        </div>
    </div>
</header>

<section class="cardapio" style="padding-top:120px;">
    <div class="container">

        <h2>Sobremesas</h2>

        <div class="cardapio-grid">

            <div class="cardapio-item">
                <img src="Imagens/Sobremesas/Brownie.png" alt="">
                <h3>Brownie Cyber</h3>
                <p>Brownie quente com calda de chocolate.</p>
                <span>R$ 15,90</span>
            </div>

            <div class="cardapio-item">
                <img src="Imagens/Sobremesas/Milkshake.png" alt="">
                <h3>Milk Shake Neon</h3>
                <p>Chocolate, morango ou baunilha.</p>
                <span>R$ 18,90</span>
            </div>

            <div class="cardapio-item">
                <img src="Imagens/Sobremesas/Sundae.png" alt="">
                <h3>Sundae Rust</h3>
                <p>Sorvete com cobertura especial da casa.</p>
                <span>R$ 14,90</span>
            </div>

        </div>

        <div class="cardapio-completo">
            <a class="botao" href="index.html">
                <span>VOLTAR AO INÍCIO</span>
            </a>
        </div>

    </div>
</section>

</body>
</html>
